<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мероприятия 2026 | MON</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body id="events-page">

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-logo" href="index.html">MON</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="index.html">Мероприятия</a>
        <a class="nav-link" href="contractors.html">Подрядчики</a>
      </div>
    </div>
  </nav>

  <div class="container">

    <header class="page-header">
      <h1 class="page-title">Мероприятия <span>2026</span></h1>
      <p class="page-subtitle">Полный календарь событий — конференции, фестивали, форумы, онлайн-эфиры</p>
    </header>

    <div class="filters-panel">
      <div class="filters-row">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию, описанию, тегам..." />
        </div>
      </div>

      <div class="filters-row">
        <div class="select-group">
          <label class="select-label">Город</label>
          <select id="filter-city" class="filter-select"></select>
        </div>
        <div class="select-group">
          <label class="select-label">Важность</label>
          <select id="filter-importance" class="filter-select"></select>
        </div>
        <div class="select-group">
          <label class="select-label">Месяц</label>
          <select id="filter-month" class="filter-select"></select>
        </div>
      </div>

      <div class="filters-actions">
        <div class="results-info" id="results-info">Загрузка...</div>
        <button class="btn-reset" id="btn-reset">✕ Сбросить фильтры</button>
      </div>
    </div>

    <section id="featured-section" class="featured-section">
      <div class="section-header">
        <h2 class="section-title">Главные события года</h2>
      </div>
      <div id="featured-grid" class="featured-grid"></div>
    </section>

    <div>
      <div class="section-header" style="margin-bottom:24px">
        <h2 class="section-title">Все мероприятия</h2>
      </div>
      <div id="all-events"></div>
    </div>

    <div class="no-results" id="no-results">
      <div class="no-results-icon">🔎</div>
      <h3>Ничего не нашлось</h3>
      <p>Попробуйте изменить фильтры или поисковый запрос</p>
    </div>

  </div>

  <footer>
    <p>MON — внутренняя платформа команды · 2026</p>
  </footer>

  <script src="data/events.js"></script>
  <script src="app.js"></script>
</body>
</html>
